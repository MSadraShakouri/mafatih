name: Build Android APK

# Like Satr: v* tags (including v0.x) build a fixed-key debug APK and
# publish a GitHub Release; manual runs produce a downloadable artifact.
# The repository secret ANDROID_KEYSTORE_BASE64 must contain a PKCS12 key
# with alias "mafatih" and store/key password "android".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Determine Android version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
            VERSION_NAME="${LATEST_TAG#v}-${GITHUB_RUN_NUMBER}"
          fi
          case "$VERSION_NAME" in
            ''|*[!a-zA-Z0-9._+-]*) echo 'Invalid version name.' >&2; exit 1 ;;
          esac
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build the web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Decode the fixed debug keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mafatih-debug.p12"
          test -s "$RUNNER_TEMP/mafatih-debug.p12"

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mafatih-debug.p12
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: mafatih
          ANDROID_KEY_PASSWORD: android
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"; then
              exit 0
            fi
            echo "Gradle build attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1

      - name: Check the APK signing certificate
        env:
          LC_ALL: C
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          expected="$(keytool -list -v -storetype PKCS12 -keystore "$RUNNER_TEMP/mafatih-debug.p12" -storepass android -alias mafatih | awk '/SHA256:/{print $2; exit}')"
          actual="$(keytool -printcert -jarfile "$apk" | awk '/SHA256:/{print $2; exit}')"
          test -n "$expected" && test "$actual" = "$expected" || { echo 'APK is not signed with the configured debug key.' >&2; exit 1; }

      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "mafatih-debug-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mafatih-debug-apk
          path: mafatih-debug-*.apk
          if-no-files-found: error

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: mafatih-debug-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mafatih-debug.p12"
